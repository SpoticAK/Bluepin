    <link rel="preload" as="image" href="/bluepin-48.webp" type="image/webp" fetchpriority="high" />

    <!-- Early Theme Detection (prevents flash of white/unthemed content) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bluepin-theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- Instant Preloader Styles (Matches exact existing loading screen style) -->
    <style>
      :root {
        --bg-color: #F7F6F1;
        --text-secondary: #777670;
      }
      html.dark, html.dark :root {
        --bg-color: #121311;
        --text-secondary: #9B9A93;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          --bg-color: #121311;
          --text-secondary: #9B9A93;
        }
      }
      body {
        margin: 0;
        background-color: var(--bg-color);
      }
      #app-preloader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background-color: var(--bg-color);
        position: relative;
      }
      .preloader-logo {
        width: 3rem;
        height: 3rem;
        object-fit: contain;
        animation: preloader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .preloader-text {
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 500;
        color: var(--text-secondary);
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
      }
      @keyframes preloader-pulse {
        50% {
          opacity: 0.5;
        }
      }
    </style>

  <body>

          alt="Bluepin Logo"
          class="preloader-logo"
          width="48"
          height="48"
          fetchpriority="high"
          decoding="sync"

    <script>
      // Capture beforeinstallprompt as early as possible so it is never missed
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
